MEMORY {
  RAM: start=$0000, size=$0100, type=rw;
  HEADER: start=$0000, size=$0010, file=%O;
  PRG: start=$C000, size=$3FFA, fill=yes, file=%O;
  VECTORS: start=$FFFA, size=$0006, file=%O;
  CHR: start=$0000, size=$2000, fill=yes, file=%O;
}
SEGMENTS {
  ZEROPAGE: load=RAM, type=zp;
  HEADER: load=HEADER, type=ro;
  CODE: load=PRG, type=ro;
  RODATA: load=PRG, type=ro;
  VECTORS: load=VECTORS, type=ro;
  CHARS: load=CHR, type=ro;
}
