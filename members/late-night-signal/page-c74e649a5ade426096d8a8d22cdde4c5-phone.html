<p align="left"><span style="font-family:Courier New,Courier,monospace;font-size:18px;color:#ffeb90;text-align:left;font-style:normal;font-weight:bold">01:18 AM  A distant station drifted in after the rain. A voice read the hours in three languages.</span></p>
<p align="left"><span style="font-family:Courier New,Courier,monospace;font-size:18px;color:#ffeb90;text-align:left;font-style:normal;font-weight:bold">02:07 AM  Swung the loop toward the ridge. Under the static: a piano and a train horn.</span></p>
