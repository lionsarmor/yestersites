<p align="left"><font color="#ffeb90" face="Courier New,Courier,monospace" size="4"><b>01:18 AM  A distant station drifted in after the rain. A voice read the hours in three languages.</b></font></p>
<p align="left"><font color="#ffeb90" face="Courier New,Courier,monospace" size="4"><b>02:07 AM  Swung the loop toward the ridge. Under the static: a piano and a train horn.</b></font></p>
