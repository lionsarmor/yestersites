.movie-vents{flex:0 1 44px;min-width:10px;height:10px;margin-left:auto;background:repeating-linear-gradient(105deg,#0007 0 2px,#fff6 2px 3px,transparent 3px 5px)}
.movie-gate{display:flex;flex:1 1 0;min-height:0;padding:6px 8px;position:relative}
.movie-screen{position:relative;display:flex;align-items:stretch;width:100%;min-width:0;min-height:0;border:3px solid;border-color:#151a20 #c2c8cb #d3d8dc #202830;background:#080b0e;overflow:hidden}
.cinema .movie-screen :is(video,iframe){display:block;position:absolute;inset:0;width:100%;height:100%;min-height:0!important;max-width:100%;border:0;object-fit:contain;background:#080b0e}
.cinema .movie-console{display:flex;align-items:center;gap:5px;height:24px;flex:none;min-width:0;margin:0 7px;padding:2px 4px;color:var(--ink);background:var(--cap);box-shadow:inset 1px 1px 2px #0009,inset -1px -1px 0 #fff4}
.movie-source{flex:none;font: bold 9px/1.1 monospace;letter-spacing:.5px;text-transform:uppercase;color:var(--gold)}
.movie-source:before{content:'';display:inline-block;width:6px;height:6px;margin:0 5px 1px 0;border-radius:50%;background:var(--gold);box-shadow:0 0 3px var(--gold)}
.movie-title{display:block;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:inherit;font:11px/1.15 Arial,sans-serif}
.cinema .movie-console .movie-open{display:inline-flex;align-items:center;justify-content:center;width:auto;height:100%;min-height:0;margin:0;padding:0 4px;color:inherit;font:bold 10px/1 Arial,sans-serif;text-decoration:underline;white-space:nowrap}
.cinema .movie-load{position:absolute;z-index:1;left:50%;bottom:8%;transform:translateX(-50%);margin:0;padding:6px 12px;height:auto;width:max-content;max-width:96%;border:2px outset var(--light);border-radius:1px;background:var(--cap);color:var(--ink);font:bold 11px/1.15 Arial,sans-serif;cursor:pointer;box-shadow:2px 2px 0 #0008}
.movie-load:active{border-style:inset}.cinema :focus-visible{outline:2px solid #ffc84b;outline-offset:-2px}
.movie-card{position:absolute;inset:0;display:grid;place-items:center;isolation:isolate;overflow:hidden;background:#111c27}
.movie-card i{position:relative;z-index:1;display:grid;place-items:center;width:58px;height:58px;color:#eae4d3;font:normal 40px/1 Georgia,serif}

.card-channel{background:repeating-linear-gradient(0deg,#090e232d 0 1px,transparent 1px 3px),radial-gradient(ellipse at 31% 0%,#ffcb75 0%,#f48240 9%,#c43b52 21%,#562758 40%,#202350 65%,#10182b)}
.card-channel:before{content:'';position:absolute;left:-30%;right:-30%;bottom:-38%;height:90%;transform:perspective(78px) rotateX(48deg);background:repeating-linear-gradient(90deg,transparent 0 27px,#fb9e905e 28px 29px),repeating-linear-gradient(0deg,transparent 0 13px,#fca1a080 14px 15px)}
.card-channel i{width:69px;height:47px;transform:rotate(-6deg);border:3px solid #fff3de;border-radius:10px;background:#9d1f2c;color:#fff4d9;font:normal 24px Arial;box-shadow:4px 5px 0 #341b39}
.card-bars{background:linear-gradient(transparent 70%,#121815 70% 78%,transparent 78%),repeating-linear-gradient(0deg,#0003 0 1px,transparent 1px 3px),linear-gradient(90deg,#dad8c1 0 14.28%,#d4bb58 14.28% 28.57%,#6cb9b7 28.57% 42.85%,#7ea878 42.85% 57.14%,#b388a3 57.14% 71.42%,#b3695e 71.42% 85.71%,#707aa5 85.71%)}
.card-bars i,.card-leader i{border:1px solid #f3edcd;border-radius:50%;box-shadow:0 0 0 5px #1d252655,0 0 0 6px #fff9;background:#1e2528aa}
.card-leader{background:linear-gradient(transparent 49.5%,#242322 50%,transparent 50.6%),linear-gradient(90deg,transparent 49.7%,#282828 50%,transparent 50.3%),conic-gradient(from 50deg,#646159,#b1ada0 280deg,#78756d 280deg)}
.cinema-streamline{border-radius:21px 4px 9px 4px}
.cinema-streamline .movie-cap{border-radius:17px 1px 3px 2px;background:linear-gradient(105deg,#192944,#304879 60%,#13243b);border-left:7px solid #9fb9dc}
.cinema-streamline .movie-emblem{color:#f7c678}
.cinema-streamline .movie-gate{padding:6px 9px 5px;background:linear-gradient(175deg,#c0d2de55,transparent 36%)}
.retro-player.cinema-channel{--light:#f5e1c7;--mid:#c5b7a9;--dark:#82766c;--cap:#5a1720;--gold:#ffd275;border-radius:9px}
.cinema-channel .movie-cap{margin:0;height:38px;border-radius:6px 6px 0 0;background:repeating-linear-gradient(-45deg,transparent 0 4px,#ffffff09 4px 5px),linear-gradient(#af3a40,#7a1a2b 60%,#501420);border-bottom:3px double #f2caa3}
.cinema-channel .movie-cap strong{font:bold italic 23px/1 Arial,sans-serif;letter-spacing:-1.6px}.cinema-channel .movie-cap small{color:#ffdbc5}
.cinema-channel .movie-emblem{width:24px;height:20px;border-radius:5px;background:#fcf0d6;color:#651d29;transform:rotate(-7deg);box-shadow:1px 2px 0 #390c18}
.cinema-channel .movie-gate{margin:3px 4px;padding:3px 10px;background:repeating-linear-gradient(#e7d7b7 0 4px,#302d2b 4px 11px) 2px center/4px 100% no-repeat,repeating-linear-gradient(#e7d7b7 0 4px,#302d2b 4px 11px) right 2px center/4px 100% no-repeat,#302d2b}
.retro-player.cinema-studio{--light:#787e74;--mid:#454c45;--dark:#262d28;--cap:#202522;--gold:#a8e56b;border-radius:5px}
.cinema-studio .movie-cap{background:none;box-shadow:none;border-bottom:1px solid #151b17;color:#f2efdb;margin:2px 13px;height:30px}
.cinema-studio .movie-cap strong{font:900 italic 16px/1 Arial,sans-serif;text-transform:uppercase;letter-spacing:0}.cinema-studio .movie-emblem{width:13px;height:10px;border-radius:1px;color:#b3ca76}.cinema-studio .movie-emblem:after{display:none}
.cinema-studio .movie-gate{margin:0 7px 3px;padding:7px 13px;border:2px outset #7e867a;border-radius:10px;background:linear-gradient(145deg,#141815,#454b42 67%,#777e70)}
.cinema-studio .movie-screen{border:2px solid #131612;border-radius:6px;box-shadow:0 0 0 1px #686f60}
.cinema-studio .movie-console{margin:0 9px;box-shadow:none;border-top:1px solid #777b6e}
.retro-player.cinema-archive{--light:#e6cf9d;--mid:#bba276;--dark:#8c714c;--cap:#413123;--gold:#ffd687;border-radius:13px 13px 5px 5px}
.cinema-archive .movie-cap{justify-content:center;gap:9px;margin:3px 9px 0;background:none;box-shadow:none;color:#392d22;border-bottom:3px double #826a4e}
.cinema-archive .movie-cap strong{font:italic bold 23px/1 Georgia,serif}.cinema-archive .movie-cap small{font:small-caps 12px Georgia,serif;letter-spacing:1px}
.cinema-archive .movie-emblem{width:23px;height:23px;border:2px solid #483723;border-radius:50%;background:radial-gradient(circle at 50% 22%,#483723 2px,transparent 3px),radial-gradient(circle at 75% 65%,#483723 2px,transparent 3px),radial-gradient(circle at 25% 65%,#483723 2px,transparent 3px),#dbc493}
.cinema-archive .movie-emblem:after,.cinema-archive .movie-vents{display:none}.cinema-archive .movie-gate{padding:4px 12px 5px}.cinema-archive .movie-screen{border:5px ridge #78664f;border-radius:3px}
.retro-player.cinema-windows{--light:#efefed;--mid:#c3c2bf;--dark:#9d9c99;--cap:#000080;--gold:#feec84;border-radius:0}
.cinema-windows .movie-cap{height:23px;box-shadow:none;background:#000080}.cinema-windows .movie-cap strong{font:bold 14px Arial,sans-serif;letter-spacing:0}.cinema-windows .movie-console{background:#c5c5c5;color:#111;--gold:#55531d}
.cinema .transport,.cinema .movie-dummy{flex:none;display:flex;align-items:center;gap:3px;margin:0 7px 3px;padding:2px 3px;background:#bac3ce;box-shadow:inset 1px 1px 0 #eef1f5,inset -1px -1px 0 #374452;color:#152536}
.cinema .transport button,.cinema .movie-expand{flex:none;width:auto;height:23px;min-height:0;margin:0;padding:0 5px;border:2px outset #d8e2ed;border-radius:1px;background:linear-gradient(#f0f3f3,#b4c2d0);color:#182635;font:bold 11px/1 Arial,sans-serif;cursor:pointer}
.cinema .transport button:active,.cinema .movie-expand:active{border-style:inset}.cinema .transport input{flex:1 1 35px;width:30px;min-width:10px;height:18px;accent-color:#354f78}.cinema .transport input.volume{flex:0 1 38px}
.cinema .deck-clock{flex:none;align-self:flex-end;margin:0 9px 2px;padding:1px 5px;border:1px inset #9aabb9;color:#f3d78a;background:#242d39;font:10px/1.1 monospace;letter-spacing:0}
.cinema .movie-expand{height:18px;font-size:10px;padding:0 3px}.cinema .movie-dummy{font:bold 13px/18px monospace}
.cinema:fullscreen{width:100vw;height:100vh;border-radius:0}.phone .cinema.video{height:auto;min-height:205px;aspect-ratio:4/3}
@media(max-width:600px){.board .object .cinema.video{height:auto;min-height:205px;aspect-ratio:4/3}}
.cinema-channel .movie-gate{margin-right:31px}
.cinema-channel .movie-gate:after{content:'';position:absolute;top:8%;bottom:8%;right:-22px;width:15px;border-radius:8px;background:radial-gradient(ellipse at center,#423a34 0 1px,#f4e6ce 1.5px,transparent 2px) 0 0/4px 5px;box-shadow:inset 1px 1px 2px #59453777}
.retro-player.cinema-studio{padding-inline:9px;background:repeating-linear-gradient(0deg,transparent 0 2px,#1d231e30 2px 3px),linear-gradient(105deg,#535950,#353c35 75%,#565b52)}
.cinema-studio:before,.cinema-studio:after{content:'';position:absolute;top:6px;bottom:6px;width:8px;border:1px solid #242a23;border-radius:4px;background:radial-gradient(circle at 50% 6px,#0d100c 1px,#acaca0 2px,#45483f 3px,transparent 4px),radial-gradient(circle at 50% calc(100% - 6px),#11140f 1px,#aaa 2px,#45483f 3px,transparent 4px),linear-gradient(90deg,#262923,#6c7164 55%,#32372d);box-shadow:1px 0 1px #151811}
.cinema-studio:before{left:2px}.cinema-studio:after{right:2px}
.cinema-archive .movie-cap:before,.cinema-archive .movie-cap:after{content:'';flex:1;min-width:0;height:4px;border-block:1px solid #7c633f;box-shadow:0 1px 0 #ecdbb3}
.cinema-archive .movie-gate{margin:3px 8px;padding:4px 12px;background:repeating-linear-gradient(0deg,#31261c 0 3px,#af9569 3px 7px,#e0cfa7 7px 9px,#31261c 9px 14px) left 3px top/5px 100% no-repeat,repeating-linear-gradient(0deg,#31261c 0 3px,#af9569 3px 7px,#e0cfa7 7px 9px,#31261c 9px 14px) right 3px top/5px 100% no-repeat,#352b21;border:1px inset #aa926b;border-radius:4px}
.cinema-streamline .movie-cap{height:32px;margin-left:0;border-radius:0;border-left:0;padding-left:25px;clip-path:polygon(15px 0,100% 0,100% 100%,0 100%,0 23px,5px 23px,5px 16px,10px 16px,10px 8px,15px 8px)}
.cinema-streamline .transport input{appearance:none;height:15px;padding:0;border:3px inset #b8c8db;border-radius:0;background:linear-gradient(#1e2941,#2e425e)}
.cinema-streamline .transport input::-moz-range-thumb{width:7px;height:12px;border:2px outset #ebedf0;border-radius:0;background:#c3c6c8}
.cinema-streamline .transport input::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:15px;border:2px outset #ebedf0;border-radius:0;background:#c3c6c8}
@container(max-width:275px){.movie-cap small,.movie-vents,.cinema .transport input.volume{display:none}.cinema .transport{gap:1px;margin-inline:2px}.cinema .transport button{padding-inline:2px}}

.ref-wrap{display:grid;place-items:center;width:100%;height:100%;min-width:0;min-height:0;container-type:size;pointer-events:auto;text-decoration:none}
.ref-deck{display:block;position:relative;isolation:isolate;width:min(100cqw,calc(100cqh * var(--rw) / var(--rh)));max-width:100%;aspect-ratio:var(--rw)/var(--rh);background-image:var(--ref-face);background-size:100% 100%;background-repeat:no-repeat;container-type:inline-size;color:#121212;font:12px Arial,sans-serif;text-align:left;letter-spacing:normal;line-height:1;overflow:clip;text-decoration:none}
.ref-deck>*{box-sizing:border-box}.ref-deck :is(.ref-field,.ref-key,.ref-seek){position:absolute;margin:0}
.ref-deck .ref-field{display:flex;align-items:center;overflow:hidden;white-space:pre;text-align:left}
.ref-deck>audio{display:none}.ref-deck .ref-key{cursor:pointer;min-width:0;min-height:0;padding:0;border:0;border-radius:0;background:transparent;color:inherit;box-shadow:none}
.ref-deck button:focus-visible,.ref-slider:focus-within{outline:2px dotted #fff6ac;outline-offset:-3px}
.ref-deck .ref-key:not([data-key=side]):active{background:var(--ref-face) var(--key-position)/var(--key-size) no-repeat;filter:brightness(.82)}
.ref-deck[data-muted=true] [data-key=mute]{box-shadow:inset 1px 1px 2px #332e2a88}
.ref-slider{display:block;position:absolute;--progress:0%}
.ref-travel{position:absolute;inset:0 calc(var(--thumb)/2)}
.ref-progress{position:absolute;inset:0 auto 0 0;width:var(--progress);background-size:100% 100%}
.ref-head{position:absolute;inset:0 auto 0 var(--progress);transform:translateX(-50%);background-size:100% 100%;width:var(--head-width)}
.ref-deck .ref-seek{appearance:none;inset:0;width:100%;height:100%;padding:0;border:0;min-width:0;min-height:0;opacity:0;cursor:pointer}
.ref-seek::-moz-range-thumb{width:var(--head-width);height:100%;border:0}
